<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol Navideño</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            overflow: hidden;
        }

        .container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .stage-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 🎄 LETRERO TIPO POLO NORTE */
        .back-button {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px 10px 14px;
            background: linear-gradient(180deg, #d32f2f 0%, #a31515 100%);
            color: #ffffff;
            font-family: 'Bebas Neue', Arial, sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            line-height: 1;
            text-decoration: none;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
            border: 4px solid #ffffff;
            border-radius: 14px;
            box-shadow:
                0 0 0 2px #a31515 inset,
                0 5px 0 rgba(0,0,0,0.25),
                0 8px 22px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-button:hover {
            transform: translateY(-2px) rotate(-2deg);
            box-shadow:
                0 0 0 2px #a31515 inset,
                0 7px 0 rgba(0,0,0,0.25),
                0 12px 26px rgba(0,0,0,0.55);
        }

        .back-button .arrow {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        /* ❄ Copito de nieve en la esquina del letrero */
        .back-button::after {
            content: '❄';
            position: absolute;
            top: -12px;
            right: -10px;
            font-size: 1.3rem;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255,255,255,0.9);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">
        <svg class="arrow" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M34 27 C22 27 18 13 8 13 M15 6 L6 13 L15 20"
                  stroke="#ffffff" stroke-width="5"
                  stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        VOLVER
    </a>

    <div class="container">
        <img id="stageImage" class="stage-image" src="" alt="Árbol Navideño">
    </div>

    <script>
        function updateImage() {
            const stageImage = document.getElementById('stageImage');

            if (window.innerHeight > window.innerWidth) {
                // Pantalla vertical
                stageImage.src = 'img/arbol/vertical_stage.jpg';
            } else {
                // Pantalla horizontal
                stageImage.src = 'img/arbol/horizontal_stage.jpg';
            }
        }

        // Ejecutar al cargar la página
        updateImage();

        // Ejecutar cuando cambie la orientación
        window.addEventListener('resize', updateImage);
        window.addEventListener('orientationchange', updateImage);
    </script>
</body>
</html>
