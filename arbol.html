<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Árbol Navideño</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <!-- Estilos fragmentados con anti-caché v=19 -->
    <link rel="stylesheet" href="css/arbol-base.css?v=19">
    <link rel="stylesheet" href="css/arbol-relojes.css?v=19">
    <link rel="stylesheet" href="css/arbol-ui.css?v=19">
    <link rel="stylesheet" href="css/arbol-botones.css?v=19">
    <link rel="stylesheet" href="css/arbol-modales.css?v=19">
    <link rel="stylesheet" href="css/arbol-efectos.css?v=19">
    <link rel="stylesheet" href="css/arbol-responsive.css?v=19">
</head>
<body>
    <!-- MENÚ HAMBURGUESA -->
    <button id="btnMenuHamburguesa" class="menu-hamburguesa-btn" aria-label="Abrir menú de opciones">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- CONTENEDOR DEL MENÚ DESPLEGABLE -->
    <nav id="menuDesplegable" class="menu-desplegable">
        <a href="index.html" class="menu-item">🏠 <span data-i18n="menu_return">VOLVER</span></a>
        <a href="https://ko-fi.com/mar_gus" target="_blank" rel="noopener" class="menu-item">☕ <span data-i18n="menu_donate">DONAR</span></a>
        <button id="btnHonorMenu" class="menu-item menu-btn">🏆 <span data-i18n="menu_best">MEJORES</span></button>
        
        <!-- Botón de Música en el menú -->
        <button class="menu-item btn-musica-menu" id="btnMusicaMenu" aria-label="Activar música">
            <span class="icono-musica">🔇</span> <span data-i18n="menu_music">Música</span>
        </button>
        
        <!-- Botón de Idioma en el menú -->
        <button class="menu-item btn-idioma-menu" id="btnIdiomaMenu" aria-label="Cambiar a inglés">
            <span class="bandera">🇬🇧</span> <span data-i18n="menu_lang">Idioma</span>
        </button>
    </nav>

    <!-- Botón Volver (Oculto por CSS) -->
    <a href="index.html" class="back-button">
        <svg class="arrow" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M34 27 C22 27 18 13 8 13 M15 6 L6 13 L15 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span data-i18n="menu_return">VOLVER</span>
    </a>

    <!-- Relojes -->
    <div class="zona-relojes">
        <div class="fila-donate-reloj">
            <a href="https://ko-fi.com/mar_gus" target="_blank" rel="noopener" class="btn-donate">☕ <span data-i18n="menu_donate">Donar</span></a>
            <div class="reloj" id="relojGlobal">
                <span class="reloj-etiqueta" data-i18n="clock_remaining">⏱ Restan</span>
                <span class="reloj-numero" id="relojGlobalNumero">08:00</span>
            </div>
        </div>
        <div class="reloj" id="relojFinal" style="display: none;">
            <span class="reloj-etiqueta" data-i18n="clock_final">🔥 Final</span>
            <span class="reloj-numero" id="relojFinalNumero">01:30</span>
        </div>
    </div>

    <!-- Botón Tabla de Honor (Oculto por CSS) -->
    <button class="btn-honor" id="btnHonor">🏆 <span data-i18n="menu_best">Mejores</span></button>

    <!-- Barra de Progreso -->
    <div class="panel-progreso">
        <div class="barra-contenedor">
            <span class="label-progreso" data-i18n="progress_label">Progreso del Árbol</span>
            <div class="barra-fondo">
                <div id="barraGeneral" class="barra-relleno" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <!-- Escenario -->
    <div class="container">
        <img id="stageImage" class="stage-image" src="" alt="Árbol Navideño">
        <div class="escena-overlay">
            <div class="zona-figuras" id="zonaFiguras"></div>
        </div>
    </div>

    <!-- Panel de Avatares -->
    <aside class="panel-avatars" id="panelAvatars"></aside>

    <!-- Panel de Controles -->
    <div class="panel-controles" id="panelControles">
        <div class="fila-bloques">
            <div class="bloque-control">
                <label for="sliderX" data-i18n="ctrl_horizontal">↔ Horizontal</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderX" min="0" max="100" value="50" step="0.5">
                    <input type="number" id="inputX" min="0" max="100" step="0.1" value="50" class="input-numerico" aria-label="Valor horizontal">
                </div>
            </div>
            <div class="bloque-control">
                <label for="sliderY" data-i18n="ctrl_vertical">↕ Vertical</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderY" min="0" max="100" value="50" step="0.5">
                    <input type="number" id="inputY" min="0" max="100" step="0.1" value="50" class="input-numerico" aria-label="Valor vertical">
                </div>
            </div>
            <div class="bloque-control">
                <label for="sliderZoom" data-i18n="ctrl_size">🔍 Tamaño</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderZoom" min="40" max="300" value="100" step="1">
                    <input type="number" id="inputZoom" min="40" max="300" step="1" value="100" class="input-numerico" aria-label="Valor tamaño">
                </div>
            </div>
            <div class="bloque-control">
                <label for="sliderGiro" data-i18n="ctrl_rotate">🔄 Girar</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderGiro" min="-180" max="180" value="0" step="1">
                    <input type="number" id="inputGiro" min="-180" max="180" step="1" value="0" class="input-numerico" aria-label="Valor giro">
                </div>
            </div>
        </div>
        <div class="fila-botones">
            <button id="btnVoltear" class="ctrl-btn" data-i18n="btn_flip">🪞 Voltear</button>
            <button id="btnDuplicar" class="ctrl-btn" data-i18n="btn_duplicate">📋 Duplicar</button>
            <button id="btnCapas" class="ctrl-btn" data-i18n="btn_layers">📚 Capas</button>
            <button id="btnQuitar" class="ctrl-btn ctrl-quitar" data-i18n="btn_remove">✕ Quitar</button>
        </div>
    </div>

    <!-- Modal de Capas -->
    <div class="modal-capas" id="modalCapas">
        <div class="modal-contenido">
            <h3 data-i18n="modal_layers_title">Orden de Capas</h3>
            <div id="listaCapas" class="lista-capas"></div>
            <button id="btnCerrarCapas" class="ctrl-btn" style="margin-top: 15px; width: 100%;" data-i18n="btn_close">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Resultado Final -->
    <div class="modal-resultado" id="modalResultado">
        <div class="modal-resultado-contenido">
            <button class="modal-cerrar-x" id="btnCerrarXResultado" title="Salir sin guardar">✕</button>
            <h2 class="modal-resultado-titulo" id="resultadoTitulo" data-i18n="modal_result_title">Veredicto</h2>
            <div class="modal-resultado-puntaje" id="resultadoPuntaje">0/100</div>
            <p class="modal-resultado-mensaje" id="resultadoMensaje"></p>
            
            <div class="modal-resultado-detalles">
                <h4 data-i18n="modal_result_details">Detalle de relaciones:</h4>
                <div id="listaDetalles"></div>
            </div>
            
            <div class="campo-nombre" id="campoNombre">
                <label for="inputNombre" data-i18n="modal_name_label">✍️ Escribe tu nombre para la tabla de honor:</label>
                <input type="text" id="inputNombre" maxlength="20" data-i18n-placeholder="modal_name_placeholder" placeholder="Tu nombre aquí" autocomplete="off">
                <button class="modal-resultado-btn" id="btnGuardarNombre" data-i18n="btn_save_name">Guardar y Ver Tabla</button>
            </div>
        </div>
    </div>

    <!-- Modal de Tabla de Honor -->
    <div class="modal-honor" id="modalHonor">
        <div class="modal-honor-contenido">
            <h3 data-i18n="modal_honor_title">🏆 Tabla de Honor Local</h3>
            <div id="listaHonor" class="lista-honor"></div>
            <button class="modal-resultado-btn" id="btnCerrarHonor" data-i18n="btn_close">Cerrar</button>
        </div>
    </div>

    <!-- ZONA DE REINICIO -->
    <div class="zona-reinicio" id="zonaReinicio">
        <button class="btn-reiniciar" id="btnReiniciar" data-i18n="btn_restart">🔄 REINICIAR ÁRBOL</button>
        <button class="btn-seguir-decorando" id="btnSeguirDecorando" data-i18n="btn_continue">🎄 Seguir decorando tu Árbol</button>
    </div>

    <!-- Lupa Matemática -->
    <div id="debugPanel" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; max-height: 80vh; background: rgba(20, 20, 30, 0.98); color: #fff; padding: 20px; font-family: sans-serif; font-size: 14px; z-index: 9999; border: 2px solid #ffd700; border-radius: 15px; display: none; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.8);">
        <h3 style="color: #ffd700; margin-top: 0; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px;" data-i18n="debug_title">🔍 Lupa Matemática</h3>
        <div id="debugContent" style="margin-bottom: 15px;" data-i18n="debug_loading">Cargando datos...</div>
        <button onclick="document.getElementById('debugPanel').style.display='none'" style="width:100%; padding:12px; background:#d32f2f; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold;" data-i18n="debug_close">Cerrar</button>
    </div>

    <!-- Botón flotante para abrir la lupa -->
    <button id="btnDebug" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; background: #ffd700; color: #000; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 16px; display: none;" data-i18n="debug_btn">🔍 Ver Solución</button>

    <!-- BOTÓN TEMPORAL DE DIAGNÓSTICO (Solo para ver qué pasa, no daña nada) -->
    <button id="btnDiagnostico" style="position: fixed; bottom: 80px; right: 20px; z-index: 10000; background: #ff6600; color: #fff; border: 3px solid #fff; padding: 12px 20px; border-radius: 25px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; display: block; cursor: pointer;">🔬 DIAGNÓSTICO</button>
    
    <!-- Panel que mostrará la información del diagnóstico -->
    <div id="panelDiagnostico" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; max-height: 80vh; background: rgba(0,0,0,0.95); color: #fff; padding: 20px; font-family: monospace; font-size: 13px; z-index: 10001; border: 2px solid #ff6600; border-radius: 15px; overflow-y: auto; line-height: 1.6;">
        <h3 style="color: #ff6600; margin-top: 0; text-align: center;">🔬 DIAGNÓSTICO DEL ÁRBOL</h3>
        <div id="contenidoDiagnostico"></div>
        <button onclick="document.getElementById('panelDiagnostico').style.display='none'" style="width:100%; padding:12px; background:#d32f2f; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; margin-top: 15px; cursor: pointer;">CERRAR</button>
    </div>

    <script>
        // ============ LÓGICA DEL MENÚ HAMBURGUESA (Limpia y profesional) ============
        document.addEventListener('DOMContentLoaded', function() {
            const btnMenu = document.getElementById('btnMenuHamburguesa');
            const menuDesplegable = document.getElementById('menuDesplegable');
            const btnHonorMenu = document.getElementById('btnHonorMenu');
            
            if (btnMenu && menuDesplegable) {
                function alternarMenu(e) {
                    if (e) { e.preventDefault(); e.stopPropagation(); }
                    menuDesplegable.classList.toggle('activo');
                    btnMenu.classList.toggle('activo');
                }

                btnMenu.addEventListener('click', alternarMenu);
                btnMenu.addEventListener('touchstart', alternarMenu, { passive: false });
                
                if (btnHonorMenu && typeof mostrarTablaHonor === 'function') {
                    btnHonorMenu.addEventListener('click', (e) => {
                        e.stopPropagation();
                        mostrarTablaHonor();
                        menuDesplegable.classList.remove('activo');
                        btnMenu.classList.remove('activo');
                    });
                }

                document.addEventListener('click', (e) => {
                    if (menuDesplegable.classList.contains('activo')) {
                        if (!menuDesplegable.contains(e.target) && e.target !== btnMenu) {
                            setTimeout(() => {
                                menuDesplegable.classList.remove('activo');
                                btnMenu.classList.remove('activo');
                            }, 150);
                        }
                    }
                });
            }
        });

        // ============ INTERRUPTOR DE LA LUPA ============
        const LUPA_ACTIVA = false;
        if (LUPA_ACTIVA) { 
            const btnDebug = document.getElementById('btnDebug');
            if(btnDebug) btnDebug.style.display = 'block'; 
        }
        const btnDebugEl = document.getElementById('btnDebug');
        if (btnDebugEl) {
            btnDebugEl.addEventListener('click', function() {
                document.getElementById('debugPanel').style.display = 'block';
                if(typeof actualizarProgresoGeneral === 'function') actualizarProgresoGeneral();
            });
        }

        // ============ LÓGICA DEL BOTÓN DE DIAGNÓSTICO ============
        document.addEventListener('DOMContentLoaded', function() {
            const btnDiag = document.getElementById('btnDiagnostico');
            if (btnDiag) {
                btnDiag.addEventListener('click', function() {
                    var info = '';
                    
                    // 1. ¿Existe el sistema de idioma?
                    info += '<b>1. SistemaIdioma:</b> ' + (typeof window.SistemaIdioma !== 'undefined' ? '✅ EXISTE' : '❌ NO EXISTE') + '<br>';
                    
                    // 2. ¿Qué idioma está activo?
                    if (window.SistemaIdioma) {
                        info += '<b>2. Idioma actual:</b> ' + window.SistemaIdioma.actual() + '<br>';
                    }
                    
                    // 3. ¿Existe la función tFiguras?
                    info += '<b>3. Función tFiguras:</b> ' + (typeof tFiguras !== 'undefined' ? '✅ EXISTE' : '❌ NO EXISTE') + '<br>';
                    
                    // 4. ¿Qué devuelve tFiguras para el Bastón?
                    if (typeof tFiguras !== 'undefined') {
                        var nombreBaston = tFiguras('char_baston');
                        var mensajeBase = tFiguras('msg_remove_confirm');
                        info += '<b>4. Nombre "bastón" traducido:</b> "' + nombreBaston + '"<br>';
                        info += '<b>5. Mensaje base:</b> "' + mensajeBase + '"<br>';
                        var mensajeFinal = mensajeBase.replace('{nombre}', nombreBaston);
                        info += '<b>6. Mensaje final completo:</b> "' + mensajeFinal + '"<br>';
                    }
                    
                    // 7. ¿Existe SistemaMusica?
                    info += '<b>7. SistemaMusica:</b> ' + (typeof window.SistemaMusica !== 'undefined' ? '✅ EXISTE' : '❌ NO EXISTE') + '<br>';
                    
                    // 8. ¿Está sonando la música?
                    if (window.SistemaMusica && typeof window.SistemaMusica.estaSonando === 'function') {
                        info += '<b>8. Música sonando:</b> ' + (window.SistemaMusica.estaSonando() ? '✅ SÍ' : '❌ NO') + '<br>';
                    }
                    
                    info += '<br><i style="color:#aaa;">Si ves esto, el diagnóstico funciona. Copia este texto y pégalo para analizarlo.</i>';
                    
                    document.getElementById('contenidoDiagnostico').innerHTML = info;
                    document.getElementById('panelDiagnostico').style.display = 'block';
                });
            }
        });
    </script>

    <!-- Scripts con anti-caché v=19 -->
    <!-- IMPORTANTE: Idioma y Música cargan PRIMERO para que estén listos cuando el juego los necesite -->
    <script src="js/idioma.js?v=9"></script>
    <script src="js/musica.js?v=9"></script>
    <script src="js/arbol-datos.js?v=19"></script>
    <script src="js/arbol-geometria.js?v=19"></script>
    <script src="js/arbol-reglas.js?v=19"></script>
    <script src="js/arbol-interfaz.js?v=19"></script>
    <script src="js/arbol-tiempo.js?v=19"></script>
    <script src="js/arbol-figuras.js?v=19"></script>
    <script src="js/arbol-controles.js?v=19"></script>
    <script src="js/arbol-monitor.js?v=19"></script>
</body>
</html>
