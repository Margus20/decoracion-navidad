<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Magic Christmas</title>
    <link rel="icon" type="image/jpg" href="img/belen/star_avatar.jpg">
    <meta property="og:title" content="Magic Christmas - Decorate the tree and set up the nativity">
    <meta property="og:description" content="Interactive app to decorate the Christmas tree and set up the nativity scene by dragging ornaments and characters.">
    <meta property="og:image" content="https://Margus20.github.io/decoracion-navidad/img/portada_en_horizontal.jpg">
    <meta property="og:url" content="https://Margus20.github.io/decoracion-navidad/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://Margus20.github.io/decoracion-navidad/img/portada_en_horizontal.jpg">
    
    <!-- Versión actualizada a v=7 para forzar la limpieza de caché -->
    <link rel="stylesheet" href="estilos.css?v=7">
</head>
<body>
    <div class="portada">
        <picture>
            <source media="(min-width: 768px)" srcset="img/portada_en_horizontal.jpg">
            <img src="img/portada_en_vertical.jpg" alt="Magic Christmas - choose to decorate the tree or set up the nativity">
        </picture>
        <div class="aura-titulo"></div>
        <div class="botones-portada">
            <a href="arbol.html" class="btn-portada btn-arbol" aria-label="Decorate tree"></a>
            <a href="belen.html" class="btn-portada btn-belen" aria-label="Set up nativity"></a>
        </div>
        <button class="btn-musica" aria-label="Play music" title="Play music">
            <span class="icono-musica">🔇</span>
        </button>
        <button class="btn-idioma" aria-label="Switch language to Spanish" title="Switch language to Spanish">
            <span class="bandera">🇪🇸</span>
        </button>
    </div>

    <!-- Scripts con versión actualizada a v=7 -->
    <script src="script.js"></script>
    <script src="js/idioma.js?v=7"></script>
    <script src="js/musica.js?v=7"></script>
</body>
</html>
