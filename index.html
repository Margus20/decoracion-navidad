<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Navidad Mágica</title>
    
    <!-- Favicon: el ícono chiquito en la pestaña del navegador -->
    <link rel="icon" type="image/jpg" href="img/belen/star_avatar.jpg">
    
    <!-- Información para cuando se comparte el enlace en redes sociales -->
    <meta property="og:title" content="Navidad Mágica - Decora tu árbol y arma tu Belén">
    <meta property="og:description" content="Aplicación interactiva para decorar el arbolito de Navidad y armar el Belén arrastrando los adornos y personajes.">
    <meta property="og:image" content="https://Margus20.github.io/decoracion-navidad/img/belen/portada-horizontal.jpg">
    <meta property="og:url" content="https://Margus20.github.io/decoracion-navidad/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://Margus20.github.io/decoracion-navidad/img/belen/portada-horizontal.jpg">
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="portada">
        <!-- Imagen que se adapta automáticamente a vertical u horizontal -->
        <picture>
            <source media="(min-width: 768px)" srcset="img/belen/portada-horizontal.jpg">
            <img src="img/belen/portada-vertical.jpg" alt="Navidad Mágica - elige decorar el árbol o armar el Belén">
        </picture>
        
        <!-- Aura de resplandor sobre el título -->
        <div class="aura-titulo"></div>
        
        <!-- Capa invisible con los botones funcionales encima de la imagen -->
        <div class="botones-portada">
            <a href="arbol.html" class="btn-portada btn-arbol" aria-label="Decorar árbol"></a>
            <a href="belen.html" class="btn-portada btn-belen" aria-label="Armar Belén"></a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
