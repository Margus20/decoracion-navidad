<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Belén Navideño</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="belen.css">
</head>
<body>
    <a href="index.html" class="back-button">
        <svg class="arrow" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M34 27 C22 27 18 13 8 13 M15 6 L6 13 L15 20"
                  stroke="#ffffff" stroke-width="5"
                  stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        VOLVER
    </a>

    <!-- NUEVO: Relojes del juego (debajo del botón VOLVER) -->
    <div class="zona-relojes">
        <div class="reloj" id="relojGlobal">
            <span class="reloj-etiqueta">⏱ Global</span>
            <span class="reloj-numero" id="relojGlobalNumero">08:00</span>
        </div>
        <div class="reloj" id="relojFinal" style="display: none;">
            <span class="reloj-etiqueta">🔥 Final</span>
            <span class="reloj-numero" id="relojFinalNumero">00:45</span>
        </div>
    </div>

    <!-- NUEVO: Botón para ver la tabla de honor -->
    <button class="btn-honor" id="btnHonor">🏆 Mejores</button>

    <!-- Barras de Progreso -->
    <div class="panel-progreso">
        <div class="barra-contenedor">
            <span class="label-progreso">Progreso del Belén</span>
            <div class="barra-fondo"><div id="barraGeneral" class="barra-relleno" style="width: 0%;"></div></div>
        </div>
        <div class="barra-contenedor" id="contenedorBarraIndividual" style="display: none;">
            <span class="label-progreso" id="textoBarraIndividual">Ubicación de la pieza</span>
            <div class="barra-fondo"><div id="barraIndividual" class="barra-relleno" style="width: 0%;"></div></div>
        </div>
    </div>

    <div class="container">
        <img id="stageImage" class="stage-image" src="" alt="Belén Navideño">
        <div class="escena-overlay">
            <div class="zona-figuras" id="zonaFiguras"></div>
        </div>
    </div>

    <aside class="panel-avatars" id="panelAvatars"></aside>

    <!-- Panel de controles de la pieza activa -->
    <div class="panel-controles" id="panelControles">
        <div class="fila-bloques">
            <div class="bloque-control">
                <label for="sliderX">↔ Horizontal</label>
                <input type="range" id="sliderX" min="0" max="100" value="50" step="0.5">
            </div>
            <div class="bloque-control">
                <label for="sliderY">↕ Vertical</label>
                <input type="range" id="sliderY" min="0" max="100" value="50" step="0.5">
            </div>
            <div class="bloque-control">
                <label for="sliderZoom">🔍 Tamaño</label>
                <input type="range" id="sliderZoom" min="40" max="300" value="100" step="1">
            </div>
            <div class="bloque-control">
                <label for="sliderGiro">🔄 Girar</label>
                <input type="range" id="sliderGiro" min="-180" max="180" value="0" step="1">
            </div>
        </div>
        <div class="fila-botones">
            <button id="btnVoltear" class="ctrl-btn">🪞 Voltear</button>
            <button id="btnDuplicar" class="ctrl-btn">📋 Duplicar</button>
            <button id="btnCapas" class="ctrl-btn">📚 Capas</button>
            <button id="btnQuitar" class="ctrl-btn ctrl-quitar">✕ Quitar</button>
        </div>
    </div>

    <!-- Modal de Capas -->
    <div class="modal-capas" id="modalCapas">
        <div class="modal-contenido">
            <h3>Orden de Capas</h3>
            <div id="listaCapas" class="lista-capas"></div>
            <button id="btnCerrarCapas" class="ctrl-btn" style="margin-top: 15px; width: 100%;">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Resultado Final (AJUSTADO con campo de nombre) -->
    <div class="modal-resultado" id="modalResultado">
        <div class="modal-resultado-contenido">
            <h2 class="modal-resultado-titulo" id="resultadoTitulo">Veredicto</h2>
            <div class="modal-resultado-puntaje" id="resultadoPuntaje">0/100</div>
            <p class="modal-resultado-mensaje" id="resultadoMensaje"></p>
            <div class="modal-resultado-detalles">
                <h4>Detalle de relaciones:</h4>
                <div id="listaDetalles"></div>
            </div>
            
            <!-- NUEVO: Campo para escribir el nombre -->
            <div class="campo-nombre" id="campoNombre">
                <label for="inputNombre">✍️ Escribe tu nombre para la tabla de honor:</label>
                <input type="text" id="inputNombre" maxlength="20" placeholder="Tu nombre aquí" autocomplete="off">
                <button class="modal-resultado-btn" id="btnGuardarNombre">Guardar y Ver Tabla</button>
            </div>
            
            <button class="modal-resultado-btn" id="btnCerrarResultado" style="display: none;">Cerrar</button>
        </div>
    </div>

    <!-- NUEVO: Modal de Tabla de Honor -->
    <div class="modal-honor" id="modalHonor">
        <div class="modal-honor-contenido">
            <h3>🏆 Tabla de Honor Local</h3>
            <div id="listaHonor" class="lista-honor"></div>
            <button class="modal-resultado-btn" id="btnCerrarHonor">Cerrar</button>
        </div>
    </div>

    <!-- Scripts divididos en la carpeta js/ para mejor organización -->
    <script src="js/belen-datos.js"></script>
    <script src="js/belen-logica.js"></script>
    <script src="js/belen-acciones.js"></script>
</body>
</html>
