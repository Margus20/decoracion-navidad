<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Belén Navideño</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <!-- Estilos fragmentados con anti-caché v=16 -->
    <link rel="stylesheet" href="css/belen-base.css?v=16">
    <link rel="stylesheet" href="css/belen-relojes.css?v=16">
    <link rel="stylesheet" href="css/belen-ui.css?v=16">
    <link rel="stylesheet" href="css/belen-botones.css?v=16">
    <link rel="stylesheet" href="css/belen-modales.css?v=16">
    <link rel="stylesheet" href="css/belen-efectos.css?v=16">
    <link rel="stylesheet" href="css/belen-responsive.css?v=16">
</head>
<body>
    <!-- MENÚ HAMBURGUESA (Siempre visible, unificado) -->
    <button id="btnMenuHamburguesa" class="menu-hamburguesa-btn" aria-label="Abrir menú de opciones">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- CONTENEDOR DEL MENÚ DESPLEGABLE -->
    <nav id="menuDesplegable" class="menu-desplegable">
        <a href="index.html" class="menu-item">🏠 VOLVER</a>
        <a href="https://ko-fi.com/mar_gus" target="_blank" rel="noopener" class="menu-item">☕ DONAR</a>
        <button id="btnHonorMenu" class="menu-item menu-btn">🏆 MEJORES</button>
    </nav>

    <!-- Botón Volver (Oculto por CSS, vive en el menú) -->
    <a href="index.html" class="back-button">
        <svg class="arrow" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M34 27 C22 27 18 13 8 13 M15 6 L6 13 L15 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        VOLVER
    </a>

    <!-- Relojes y Botón de Donar -->
    <div class="zona-relojes">
        <div class="fila-donate-reloj">
            <a href="https://ko-fi.com/mar_gus" target="_blank" rel="noopener" class="btn-donate">☕ Donar</a>
            <div class="reloj" id="relojGlobal">
                <span class="reloj-etiqueta">⏱ Restan</span>
                <span class="reloj-numero" id="relojGlobalNumero">08:00</span>
            </div>
        </div>
        <div class="reloj" id="relojFinal" style="display: none;">
            <span class="reloj-etiqueta">🔥 Final</span>
            <span class="reloj-numero" id="relojFinalNumero">00:45</span>
        </div>
    </div>

    <!-- Botón Tabla de Honor (Oculto por CSS, vive en el menú) -->
    <button class="btn-honor" id="btnHonor">🏆 Mejores</button>

    <!-- Barra de Progreso General -->
    <div class="panel-progreso">
        <div class="barra-contenedor">
            <span class="label-progreso">Progreso del Belén</span>
            <div class="barra-fondo">
                <div id="barraGeneral" class="barra-relleno" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <!-- Escenario -->
    <div class="container">
        <img id="stageImage" class="stage-image" src="" alt="Belén Navideño">
        <div class="escena-overlay">
            <div class="zona-figuras" id="zonaFiguras"></div>
        </div>
    </div>

    <!-- Panel de Avatares -->
    <aside class="panel-avatars" id="panelAvatars"></aside>

    <!-- Panel de Controles (CON CAMPOS NUMÉRICOS) -->
    <div class="panel-controles" id="panelControles">
        <div class="fila-bloques">
            <div class="bloque-control">
                <label for="sliderX">↔ Horizontal</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderX" min="0" max="100" value="50" step="0.5">
                    <input type="number" id="inputX" min="0" max="100" step="0.1" value="50" class="input-numerico" aria-label="Valor horizontal">
                </div>
            </div>
            <div class="bloque-control">
                <label for="sliderY">↕ Vertical</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderY" min="0" max="100" value="50" step="0.5">
                    <input type="number" id="inputY" min="0" max="100" step="0.1" value="50" class="input-numerico" aria-label="Valor vertical">
                </div>
            </div>
            <div class="bloque-control">
                <label for="sliderZoom">🔍 Tamaño</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderZoom" min="40" max="300" value="100" step="1">
                    <input type="number" id="inputZoom" min="40" max="300" step="1" value="100" class="input-numerico" aria-label="Valor tamaño">
                </div>
            </div>
            <div class="bloque-control">
                <label for="sliderGiro">🔄 Girar</label>
                <div class="fila-control-numerico">
                    <input type="range" id="sliderGiro" min="-180" max="180" value="0" step="1">
                    <input type="number" id="inputGiro" min="-180" max="180" step="1" value="0" class="input-numerico" aria-label="Valor giro">
                </div>
            </div>
        </div>
        <div class="fila-botones">
            <button id="btnVoltear" class="ctrl-btn">🪞 Voltear</button>
            <button id="btnDuplicar" class="ctrl-btn">📋 Duplicar</button>
            <button id="btnCapas" class="ctrl-btn">📚 Capas</button>
            <button id="btnQuitar" class="ctrl-btn ctrl-quitar">✕ Quitar</button>
        </div>
    </div>

    <!-- Modal de Capas -->
    <div class="modal-capas" id="modalCapas">
        <div class="modal-contenido">
            <h3>Orden de Capas</h3>
            <div id="listaCapas" class="lista-capas"></div>
            <button id="btnCerrarCapas" class="ctrl-btn" style="margin-top: 15px; width: 100%;">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Resultado Final -->
    <div class="modal-resultado" id="modalResultado">
        <div class="modal-resultado-contenido">
            <button class="modal-cerrar-x" id="btnCerrarXResultado" title="Salir sin guardar">✕</button>
            <h2 class="modal-resultado-titulo" id="resultadoTitulo">Veredicto</h2>
            <div class="modal-resultado-puntaje" id="resultadoPuntaje">0/100</div>
            <p class="modal-resultado-mensaje" id="resultadoMensaje"></p>
            
            <div class="modal-resultado-detalles">
                <h4>Detalle de relaciones:</h4>
                <div id="listaDetalles"></div>
            </div>
            
            <div class="campo-nombre" id="campoNombre">
                <label for="inputNombre">✍️ Escribe tu nombre para la tabla de honor:</label>
                <input type="text" id="inputNombre" maxlength="20" placeholder="Tu nombre aquí" autocomplete="off">
                <button class="modal-resultado-btn" id="btnGuardarNombre">Guardar y Ver Tabla</button>
            </div>
        </div>
    </div>

    <!-- Modal de Tabla de Honor -->
    <div class="modal-honor" id="modalHonor">
        <div class="modal-honor-contenido">
            <h3>🏆 Tabla de Honor Local</h3>
            <div id="listaHonor" class="lista-honor"></div>
            <button class="modal-resultado-btn" id="btnCerrarHonor">Cerrar</button>
        </div>
    </div>

    <!-- ZONA DE REINICIO -->
    <div class="zona-reinicio" id="zonaReinicio">
        <button class="btn-reiniciar" id="btnReiniciar">🔄 REINICIAR BELÉN</button>
        <button class="btn-seguir-decorando" id="btnSeguirDecorando">🌟 Seguir decorando tu Belén</button>
    </div>

    <!-- Lupa Matemática Completa -->
    <div id="debugPanel" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; max-height: 80vh; background: rgba(20, 20, 30, 0.98); color: #fff; padding: 20px; font-family: sans-serif; font-size: 14px; z-index: 9999; border: 2px solid #ffd700; border-radius: 15px; display: none; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.8);">
        <h3 style="color: #ffd700; margin-top: 0; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px;">🔍 Lupa Matemática</h3>
        <div id="debugContent" style="margin-bottom: 15px;">Cargando datos...</div>
        <button onclick="document.getElementById('debugPanel').style.display='none'" style="width:100%; padding:12px; background:#d32f2f; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold;">Cerrar</button>
    </div>

    <!-- Botón flotante para abrir la lupa -->
    <button id="btnDebug" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; background: #ffd700; color: #000; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 16px; display: none;">🔍 Ver Solución</button>

    <!-- ========================================================== -->
    <!-- ============ SCRIPTS DE LÓGICA E INTERACCIÓN ============ -->
    <!-- ========================================================== -->
    <script>
        // 1. INTERRUPTOR DE LA LUPA
        const LUPA_ACTIVA = false;
        if (LUPA_ACTIVA) { 
            const btnDebug = document.getElementById('btnDebug');
            if(btnDebug) btnDebug.style.display = 'block'; 
        }
        const btnDebugEl = document.getElementById('btnDebug');
        if (btnDebugEl) {
            btnDebugEl.addEventListener('click', function() {
                document.getElementById('debugPanel').style.display = 'block';
                if(typeof actualizarProgresoGeneral === 'function') actualizarProgresoGeneral();
            });
        }

        // 2. LÓGICA DEL MENÚ HAMBURGUESA (Infalible, probada en el Árbol)
        document.addEventListener('DOMContentLoaded', function() {
            const btnMenu = document.getElementById('btnMenuHamburguesa');
            const menuDesplegable = document.getElementById('menuDesplegable');
            const btnHonorMenu = document.getElementById('btnHonorMenu');
            
            if (btnMenu && menuDesplegable) {
                console.log("✅ ÉXITO: El botón y el menú del Belén fueron encontrados.");
                
                function probarMenu(e) {
                    e.preventDefault(); 
                    e.stopPropagation(); 
                    
                    // Feedback visual inmediato
                    btnMenu.style.backgroundColor = '#ff0000'; 
                    btnMenu.style.borderColor = '#ffffff';
                    
                    menuDesplegable.classList.toggle('activo');
                    btnMenu.classList.toggle('activo');
                    
                    console.log("📌 Estado del menú:", menuDesplegable.classList.contains('activo') ? "ABIERTO" : "CERRADO");
                }

                // Escuchamos AMBOS eventos para garantizar que funcione en tablet y PC
                btnMenu.addEventListener('click', probarMenu);
                btnMenu.addEventListener('touchstart', probarMenu, { passive: false });
                
                // Conectar el botón "Mejores" del menú
                if (btnHonorMenu && typeof mostrarTablaHonor === 'function') {
                    btnHonorMenu.addEventListener('click', (e) => {
                        e.stopPropagation();
                        mostrarTablaHonor();
                        menuDesplegable.classList.remove('activo');
                        btnMenu.classList.remove('activo');
                        // Restaurar color original
                        btnMenu.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
                        btnMenu.style.borderColor = '#ffd700';
                    });
                }

                // Cerrar menú al tocar fuera de él
                document.addEventListener('click', (e) => {
                    if (menuDesplegable.classList.contains('activo')) {
                        if (!menuDesplegable.contains(e.target) && e.target !== btnMenu) {
                            setTimeout(() => {
                                menuDesplegable.classList.remove('activo');
                                btnMenu.classList.remove('activo');
                                btnMenu.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
                                btnMenu.style.borderColor = '#ffd700';
                            }, 150);
                        }
                    }
                });
            } else {
                console.error("❌ ERROR: No se encontró el botón o el menú. Revisa los IDs en el HTML.");
            }
        });
    </script>

    <!-- Scripts con anti-caché v=16 -->
    <script src="js/belen-datos.js?v=16"></script>
    <script src="js/belen-geometria.js?v=16"></script>
    <script src="js/belen-reglas.js?v=16"></script>
    <script src="js/belen-interfaz.js?v=16"></script>
    <script src="js/belen-acciones.js?v=16"></script>
    <script src="js/belen-monitor.js?v=16"></script>
</body>
</html>
